<!DOCTYPE html>
<html>
<head>
    <style>
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            background-color: lightgrey;
            padding: 15px 25px;
        }

        .links {
            display: flex;
            gap: 20px;
        }

        .cards {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            justify-content: center;
        }

        .card {
            width: 200px;
            display: flex;
            flex-direction: column;
            border: 1px solid black;
            padding: 10px;
        }

        .card img {
            width: 100%;
        }

        .card:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

<div class="header">
    <img src="logo.png" width="50">

    <div class="links">
        <a href="#">Home</a>
        <a href="#">Breeds</a>
        <a href="#">About</a>
    </div>
</div>

<div class="cards">

    <div class="card">
        <img src="british.jpg">
        <h3>British Shorthair</h3>
        <p>A calm and friendly cat with soft, thick fur.</p>
        <button>Read more</button>
    </div>

    <div class="card">
        <img src="sphynx.jpg">
        <h3>Sphynx</h3>
        <p>A hairless cat with a unique and funny appearance.</p>
        <button>Read more</button>
    </div>

    <div class="card">
        <img src="siamese.jpg">
        <h3>Siamese</h3>
        <p>An active and social cat with beautiful blue eyes.</p>
        <button>Read more</button>
    </div>

</div>

</body>
</html>
